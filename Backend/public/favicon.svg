<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#27272A" stroke-width="6" />

  <!-- Inner Subtle Border -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.1" />

  <!-- CheckSquare Icon Container -->
  <g transform="translate(136, 136)" filter="url(#subtleGlow)">
    <!-- Rounded Outer Square Outline -->
    <rect x="12" y="12" width="216" height="216" rx="44" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Bold Clean Checkmark -->
    <path d="M72 120 L108 156 L176 84" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
